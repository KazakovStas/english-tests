<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 Таблица лидеров</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  font-family: 'Nunito', sans-serif; 
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
  color: #f1f5f9; 
  min-height: 100vh; 
  padding: 40px 20px;
}
.container { max-width: 1000px; margin: 0 auto; }
h1 { 
  text-align: center; 
  font-size: 2.5rem; 
  margin-bottom: 10px; 
  color: #fbbf24;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
}
.subtitle { text-align: center; color: #94a3b8; margin-bottom: 30px; }
.back-link { 
  display: inline-block; 
  margin-bottom: 20px; 
  color: #60a5fa; 
  text-decoration: none; 
  font-weight: 700;
}
.back-link:hover { text-decoration: underline; }
.table-container {
  background: #1e293b;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  overflow: hidden;
}
iframe {
  width: 100%;
  min-height: 600px;
  border: none;
  border-radius: 8px;
}
</style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back-link">← Вернуться к тестам</a>
  <h1> Таблица лидеров</h1>
  <p class="subtitle">Результаты всех учеников в реальном времени</p>
  
  <div class="table-container">
    <!-- ВСТАВЬТЕ СЮДА ССЫЛКУ ИЗ ШАГА 1 -->
    <iframe src="https://docs.google.com/spreadsheets/d/e/ВАШ_ID_ТАБЛИЦЫ/pubhtml?widget=true&amp;headers=false"></iframe>
  </div>
</div>
</body>
</html>
