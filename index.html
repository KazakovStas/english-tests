<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Tests Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f172a; --card: #1e293b; --primary: #3b82f6; --accent: #10b981; --text: #f1f5f9;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }

.container { max-width: 800px; width: 100%; }
h1 { text-align: center; font-size: 2.5rem; margin-bottom: 10px; color: var(--primary); }
.subtitle { text-align: center; color: #94a3b8; margin-bottom: 40px; font-size: 1.1rem; }

.screen { display: none; animation: fadeIn 0.4s ease; }
.screen.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.topics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
.topic-card {
  background: var(--card); border-radius: 16px; padding: 25px; cursor: pointer;
  border: 2px solid transparent; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
}
.topic-card:hover { border-color: var(--primary); transform: translateY(-5px); }
.topic-card h3 { color: var(--primary); font-size: 1.4rem; margin-bottom: 10px; }
.topic-card p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
.topic-tag { display: inline-block; background: rgba(59, 130, 246, 0.2); color: var(--primary); padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; margin-bottom: 12px; }

.quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 2px solid var(--card); }
.progress { color: #94a3b8; font-weight: 700; }
.question-box { background: var(--card); padding: 30px; border-radius: 16px; margin-bottom: 20px; }
.question-text { font-size: 1.4rem; font-weight: 700; margin-bottom: 25px; line-height: 1.4; }
.options { display: flex; flex-direction: column; gap: 12px; }
.option-btn {
  background: var(--bg); border: 2px solid #334155; color: var(--text); padding: 15px 20px;
  border-radius: 12px; font-size: 1.1rem; font-weight: 700; cursor: pointer; text-align: left; transition: 0.2s;
}
.option-btn:hover { border-color: var(--primary); background: rgba(59, 130, 246, 0.1); }
.option-btn.correct { background: var(--accent); border-color: var(--accent); color: #000; }
.option-btn.wrong { background: #ef4444; border-color: #ef4444; color: #fff; }
.option-btn:disabled { cursor: not-allowed; }

.result-box { text-align: center; background: var(--card); padding: 40px; border-radius: 20px; }
.score-display { font-size: 4rem; font-weight: 900; color: var(--accent); margin: 20px 0; }
.btn {
  background: var(--primary); color: #fff; border: none; padding: 14px 28px; border-radius: 10px;
  font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.2s; margin: 10px;
}
.btn:hover { opacity: 0.9; transform: scale(1.02); }
.btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.form-group { text-align: left; margin: 20px 0; }
.form-group label { display: block; margin-bottom: 8px; font-weight: 700; color: var(--primary); }
.form-group input {
  width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #334155;
  background: var(--bg); color: var(--text); font-size: 1rem; font-family: 'Nunito';
}
.form-group input:focus { outline: none; border-color: var(--primary); }

.status { margin-top: 15px; font-weight: 700; min-height: 1.5em; }
.status.success { color: var(--accent); }
.status.error { color: #ef4444; }

.back-btn { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 1rem; margin-bottom: 20px; display: flex; align-items: center; gap: 5px; }
.back-btn:hover { color: var(--text); }
</style>
</head>
<body>

<div class="container">
  
  <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ -->
  <div id="menu-screen" class="screen active">
    <h1>📚 English Tests Hub</h1>
    <p class="subtitle">Выберите тему для проверки знаний</p>
    <div class="topics-grid" id="topics-container"></div>
  </div>

  <!-- ЭКРАН 2: ТЕСТ -->
  <div id="quiz-screen" class="screen">
    <button class="back-btn" onclick="showScreen('menu-screen')">← Назад к темам</button>
    <div class="quiz-header">
      <h2 id="quiz-title">Тема</h2>
      <span class="progress" id="progress-text">Вопрос 1 из 5</span>
    </div>
    <div class="question-box">
      <div class="question-text" id="question-text">Текст вопроса?</div>
      <div class="options" id="options-container"></div>
    </div>
  </div>

  <!-- ЭКРАН 3: РЕЗУЛЬТАТ С ФОРМОЙ -->
  <div id="result-screen" class="screen">
    <div class="result-box">
      <h2>🎉 Тест завершен!</h2>
      <div class="score-display"><span id="final-score">0</span> / <span id="total-questions">0</span></div>
      <p id="result-message" style="font-size: 1.2rem; margin-bottom: 30px;">Отличная работа!</p>
      
      <p style="color: #94a3b8; margin-bottom: 20px;">Введите свои данные, чтобы результат попал к учителю:</p>
      
      <form id="result-form" onsubmit="event.preventDefault(); sendResults();">
        <div class="form-group">
          <label for="student-name">Имя и Фамилия:</label>
          <input type="text" id="student-name" placeholder="Например: Иван Иванов" required>
        </div>
        <div class="form-group">
          <label for="student-class">Класс:</label>
          <input type="text" id="student-class" placeholder="Например: 5 А" required>
        </div>
        
        <button type="submit" class="btn" id="submit-btn">📤 Отправить результат учителю</button>
      </form>
      
      <div class="status" id="send-status"></div>
      
      <button class="btn btn-outline" onclick="showScreen('menu-screen')" style="margin-top: 20px;">Выбрать другую тему</button>
    </div>
  </div>

</div>

<script>
// ==========================================================
// 🛠 ЗДЕСЬ ВЫ ДОБАВЛЯЕТЕ ИЛИ МЕНЯЕТЕ ТЕМЫ И ВОПРОСЫ
// ==========================================================
const allTopics = [
  {
    id: 'past-simple',
    tag: '5 класс',
    title: 'Past Simple',
    description: 'Правильные и неправильные глаголы в прошедшем времени.',
    questions: [
      { q: 'I ___ to the cinema yesterday.', options: ['go', 'went', 'gone'], correct: 'went' },
      { q: 'She ___ a delicious cake last Sunday.', options: ['make', 'made', 'maked'], correct: 'made' },
      { q: '___ they play football last week?', options: ['Do', 'Did', 'Were'], correct: 'Did' }
    ]
  },
  {
    id: 'have-got',
    tag: '4 класс',
    title: 'Have got / Has got',
    description: 'Утверждения, отрицания и вопросы с конструкцией have got.',
    questions: [
      { q: 'I ___ got a new laptop.', options: ['has', 'have', 'am'], correct: 'have' },
      { q: '___ she got a cat?', options: ['Have', 'Has', 'Is'], correct: 'Has' },
      { q: 'They ___ got any brothers.', options: ['haven\'t', 'hasn\'t', 'don\'t'], correct: 'haven\'t' }
    ]
  },
  {
    id: 'present-simple',
    tag: '4 класс',
    title: 'Present Simple',
    description: 'Регулярные действия, окончания -s/-es и вспомогательные глаголы.',
    questions: [
      { q: 'He usually ___ up at 7 o\'clock.', options: ['get', 'gets', 'getting'], correct: 'gets' },
      { q: 'We ___ like spiders!', options: ['doesn\'t', 'don\'t', 'isn\'t'], correct: 'don\'t' },
      { q: '___ your friend speak English?', options: ['Do', 'Does', 'Is'], correct: 'Does' }
    ]
  }
];

// ==========================================================
// ⚙️ ЛОГИКА РАБОТЫ (ЭТО МЕНЯТЬ НЕ НУЖНО)
// ==========================================================
let currentTopic = null;
let currentQuestionIndex = 0;
let score = 0;

function initMenu() {
  const container = document.getElementById('topics-container');
  container.innerHTML = '';
  allTopics.forEach(topic => {
    const card = document.createElement('div');
    card.className = 'topic-card';
    card.innerHTML = `
      <span class="topic-tag">${topic.tag}</span>
      <h3>${topic.title}</h3>
      <p>${topic.description}</p>
    `;
    card.onclick = () => startQuiz(topic);
    container.appendChild(card);
  });
}

function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}

function startQuiz(topic) {
  currentTopic = topic;
  currentQuestionIndex = 0;
  score = 0;
  document.getElementById('quiz-title').textContent = topic.title;
  showScreen('quiz-screen');
  loadQuestion();
}

function loadQuestion() {
  const q = currentTopic.questions[currentQuestionIndex];
  document.getElementById('progress-text').textContent = `Вопрос ${currentQuestionIndex + 1} из ${currentTopic.questions.length}`;
  document.getElementById('question-text').textContent = q.q;
  
  const optsContainer = document.getElementById('options-container');
  optsContainer.innerHTML = '';
  
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => checkAnswer(opt, q.correct, btn);
    optsContainer.appendChild(btn);
  });
}

function checkAnswer(selected, correct, btnElement) {
  document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
  
  if (selected === correct) {
    btnElement.classList.add('correct');
    score++;
  } else {
    btnElement.classList.add('wrong');
    document.querySelectorAll('.option-btn').forEach(b => {
      if (b.textContent === correct) b.classList.add('correct');
    });
  }
  
  setTimeout(() => {
    currentQuestionIndex++;
    if (currentQuestionIndex < currentTopic.questions.length) {
      loadQuestion();
    } else {
      showResults();
    }
  }, 1200);
}

function showResults() {
  showScreen('result-screen');
  document.getElementById('final-score').textContent = score;
  document.getElementById('total-questions').textContent = currentTopic.questions.length;
  
  const percentage = (score / currentTopic.questions.length) * 100;
  let msg = "Попробуй ещё раз! 💪";
  if (percentage === 100) msg = "Идеально! Ты мастер! 🏆";
  else if (percentage >= 70) msg = "Отличный результат! 🌟";
  else if (percentage >= 50) msg = "Хорошо, но можно лучше! 👍";
  
  document.getElementById('result-message').textContent = msg;
  
  // Сбрасываем форму и статус
  document.getElementById('result-form').reset();
  document.getElementById('send-status').textContent = '';
  document.getElementById('submit-btn').disabled = false;
}

// ==========================================================
// 📤 ОТПРАВКА РЕЗУЛЬТАТОВ В GOOGLE ТАБЛИЦУ
// ==========================================================
function sendResults() {
  const name = document.getElementById('student-name').value;
  const className = document.getElementById('student-class').value;
  const btn = document.getElementById('submit-btn');
  const status = document.getElementById('send-status');

  if (!name || !className) {
    status.textContent = "Пожалуйста, заполните имя и класс!";
    status.className = 'status error';
    return;
  }

  btn.disabled = true;
  btn.textContent = "Отправка... ⏳";
  status.textContent = "";

  // ⚠️ ВСТАВЬТЕ СЮДА ВАШ URL ИЗ GOOGLE APPS SCRIPT
 const scriptURL = 'https://script.google.com/macros/s/AKfycbxFeBo9hcgUPiBuHCHSQZbACO6W-WYAKHRpcmNrEZbfC3--LNMb1dTXqcp8G4mRUPMoCw/exec'; 
  
  // Формируем URL с параметрами (это работает надежнее с Google Apps Script)
  const params = new URLSearchParams({
    name: name,
    class: className,
    topic: currentTopic.title,
    score: score,
    total: currentTopic.questions.length
  });

  // Используем GET-запрос вместо POST
  fetch(scriptURL + '?' + params.toString(), { method: 'GET' })
    .then(response => response.text())
    .then(data => {
      status.textContent = "✅ Результат успешно отправлен учителю!";
      status.className = 'status success';
      btn.textContent = "✅ Отправлено!";
    })
    .catch(error => {
      status.textContent = "❌ Ошибка сети. Попробуйте ещё раз.";
      status.className = 'status error';
      btn.disabled = false;
      btn.textContent = "📤 Отправить результат учителю";
      console.error('Error:', error);
    });
}

initMenu();
</script>
</body>
</html>
